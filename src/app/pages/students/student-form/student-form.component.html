<div class="container mt-4">
  <h2>{{ isEditMode ? 'Modifier un étudiant' : 'Nouvel étudiant' }}</h2>

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  <form [formGroup]="studentForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-group">
      <label for="firstName">Prénom</label>
      <input
        id="firstName"
        type="text"
        class="form-control"
        formControlName="firstName"
        [ngClass]="{ 'is-invalid': submitted && form['firstName'].errors }"
      />
      @if (submitted && form['firstName'].errors) {
        <div class="invalid-feedback">Le prénom est obligatoire.</div>
      }
    </div>

    <div class="form-group">
      <label for="lastName">Nom</label>
      <input
        id="lastName"
        type="text"
        class="form-control"
        formControlName="lastName"
        [ngClass]="{ 'is-invalid': submitted && form['lastName'].errors }"
      />
      @if (submitted && form['lastName'].errors) {
        <div class="invalid-feedback">Le nom est obligatoire.</div>
      }
    </div>

    <button type="submit" class="btn btn-primary mr-2" [disabled]="loading">
      {{ loading ? 'Enregistrement…' : (isEditMode ? 'Enregistrer' : 'Créer') }}
    </button>
    <button type="button" class="btn btn-secondary mr-2" (click)="onReset()">Réinitialiser</button>
    <a class="btn btn-link" [routerLink]="['/students']">Annuler</a>
  </form>
</div>
